<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12b3a3">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/images/xiaomei.jpg">
<title>Courses</title>
<link rel="stylesheet" href="/theme.css">
<style>
  .stats{display:flex;justify-content:center;gap:26px;padding:16px 0 6px}
  .statx{display:flex;flex-direction:column;align-items:center}
  .statx .num{font-size:26px;font-weight:900;line-height:1;color:var(--brand-d)}
  .statx .num.fire{color:#ff8a00} .statx .num.done{color:#7c5cff}
  .statx .cap{font-size:11px;color:var(--ink-3);margin-top:4px;text-align:center}
  .unit{margin:18px 0 8px}
  .unit-head{border-radius:18px;padding:15px 18px;color:#fff;box-shadow:var(--shadow)}
  .unit-head h3{margin:0 0 3px;font-size:17px}
  .unit-head p{margin:0;font-size:12.5px;opacity:.92}
  .path{display:flex;flex-direction:column;align-items:center;padding:18px 0 6px}
  .node-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:6px}
  .node{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:800;cursor:pointer;position:relative;box-shadow:0 8px 18px rgba(16,60,70,.22);border:3px solid rgba(255,255,255,.7)}
  .node:active{transform:scale(.92)}
  .node.done::after{content:'✓';position:absolute;top:-5px;right:-5px;width:26px;height:26px;border-radius:50%;background:#fff;color:#111;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
  .node .best{position:absolute;bottom:-6px;right:-6px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;border:2px solid #fff}
  .nlabel{font-size:12.5px;color:var(--ink-2);margin-top:7px;text-align:center;font-weight:700;max-width:120px}
  .nlabel .sub2{display:block;color:var(--ink-3);font-weight:500;font-size:11px;margin-top:1px}
  .conn{width:3px;height:14px;background:var(--line);border-radius:2px}
  @media (max-width:640px){.node{width:62px;height:62px;font-size:24px}.stats{gap:18px}}
</style>
</head>
<body>
<div class="topbar">
  <button class="iconbtn home" onclick="location.href='/'">🏠 <span data-i18n="back_home" class="hide-sm">Home</span></button>
  <div class="title">📚 <span data-i18n="course_entry">Courses</span></div>
  <button class="iconbtn" onclick="location.href='/chat.html?mode=chat'">💬</button>
  <button class="iconbtn" onclick="Auth.logout()" data-i18n="logout">Log out</button>
</div>

<div class="wrap-narrow">
  <div class="stats">
    <div class="statx"><div class="num" id="xpNum">0</div><div class="cap">XP</div></div>
    <div class="statx"><div class="num fire" id="streakNum">0</div><div class="cap" id="streakCap">🔥</div></div>
    <div class="statx"><div class="num done" id="doneNum">0</div><div class="cap" data-i18n="completed">Done</div></div>
  </div>
  <div id="units"></div>
  <div class="contact-bar">
    <a href="mailto:gea679142@gmail.com">✉️ gea679142@gmail.com</a>
    <a class="wa" href="https://wa.me/14013090888" target="_blank" rel="noopener">💬 WhatsApp</a>
  </div>
</div>

<script src="/vendor/gsap.min.js"></script>
<script src="/auth.js"></script>
<script src="/i18n.js"></script>
<script src="/courses-data.js"></script>
<script src="/courses-i18n.js"></script>
<script src="/app-fx.js"></script>
<script>
var nativeLang = 'en';
// 单元分组（只渲染数据里真实存在的课，杜绝点不动）
var UNITS = [
  { key:'u1', grad:'linear-gradient(135deg,#22c076,#12b3a3)', ids:['b1','b2','b3','b4','b5'] },
  { key:'u2', grad:'linear-gradient(135deg,#1cb0f6,#3d7be0)', ids:['b6','b7','b8','b9','b10','b11','b12','b13','b14'] },
  { key:'u3', grad:'linear-gradient(135deg,#ff7a9c,#e0508a)', ids:['b15','b16'] },
  { key:'u4', grad:'linear-gradient(135deg,#a06bff,#7c5cff)', ids:['seasia1','seasia2','seasia3','seasia4'] },
  { key:'u5', grad:'linear-gradient(135deg,#ff9a3d,#ff6b4a)', ids:['hsk1','hsk2','hsk4'] }
];
var UNIT_META = {
  u1:{ zh:'第一单元 · 零基础入门', en:'Unit 1 · Absolute beginner' },
  u2:{ zh:'第二单元 · 日常生活', en:'Unit 2 · Daily life' },
  u3:{ zh:'第三单元 · 社交与爱好', en:'Unit 3 · Social & hobbies' },
  u4:{ zh:'第四单元 · 职场行业', en:'Unit 4 · Work & industry' },
  u5:{ zh:'第五单元 · HSK 考级', en:'Unit 5 · HSK exam' }
};
function ct(key){
  if(key==null) return '';
  var k=String(key);
  if(nativeLang==='zh') return k;
  var use=nativeLang||'en';
  var d=(typeof C_I18N!=='undefined'&&C_I18N[use])?C_I18N[use]:null;
  if(d&&d[k]) return d[k];
  if(typeof rtLoad==='function'){ var rt=rtLoad(use); if(rt&&rt[k]) return rt[k]; }
  var e=(typeof C_I18N!=='undefined'&&C_I18N.en)?C_I18N.en:null;
  return (e&&e[k])?e[k]:k;
}
function unitName(u){
  var m=UNIT_META[u.key]; if(!m) return '';
  if(nativeLang==='zh') return m.zh;
  return ct(m.zh);
}
function collectListZh(){
  var keys=[];
  Object.keys(COURSES).forEach(function(id){ if(COURSES[id].title) keys.push(COURSES[id].title); });
  UNITS.forEach(function(u){ var m=UNIT_META[u.key]; if(m&&m.zh) keys.push(m.zh); });
  var seen={},out=[]; keys.forEach(function(k){ k=String(k); if(k&&!seen[k]){seen[k]=1;out.push(k);} });
  return out;
}
function ensureListRT(){
  if(nativeLang==='zh') return Promise.resolve();
  var use=nativeLang||'en';
  if(typeof C_I18N!=='undefined'&&C_I18N[use]) return Promise.resolve();
  if(typeof rtFetch!=='function') return Promise.resolve();
  return rtFetch(use, collectListZh(), 'zh').catch(function(){return null;});
}
function renderUnits(){
  var box=document.getElementById('units'); box.innerHTML='';
  UNITS.forEach(function(u){
    var ids=u.ids.filter(function(id){return COURSES[id];});
    if(!ids.length) return;
    var sec=document.createElement('div'); sec.className='unit'; sec.setAttribute('data-fx','');
    var h='<div class="unit-head" style="background:'+u.grad+'"><h3>'+unitName(u)+'</h3><p>'+ids.length+' '+t('lessons_unit')+'</p></div><div class="path">';
    ids.forEach(function(id,i){
      var c=COURSES[id];
      h+='<div class="node-wrap" style="margin-left:'+((i%3===1)?34:(i%3===2?-34:0))+'px">'+
         '<div class="node" id="node-'+id+'" style="background:'+u.grad+'" onclick="go(\''+id+'\')">'+(c.emoji||'📘')+'</div>'+
         '<div class="nlabel" id="label-'+id+'">'+escHtml(c.title)+'<span class="sub2">'+escHtml(ct(c.title))+'</span></div></div>';
      if(i<ids.length-1) h+='<div class="conn"></div>';
    });
    h+='</div>';
    sec.innerHTML=h; box.appendChild(sec);
  });
}
function escHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function paintProgress(p){
  p=p||{};
  document.getElementById('xpNum').textContent=p.xp||0;
  document.getElementById('streakNum').textContent=p.streakDays||0;
  document.getElementById('streakCap').textContent=t('streak',{n:p.streakDays||0});
  var comp=p.completed||{};
  document.getElementById('doneNum').textContent=Object.keys(comp).length;
  Object.keys(comp).forEach(function(cid){
    var node=document.getElementById('node-'+cid), lab=document.getElementById('label-'+cid);
    if(node) node.classList.add('done');
    if(lab && comp[cid].best!=null){ var b=document.createElement('span'); b.className='best'; b.textContent='⭐'+comp[cid].best; node && node.appendChild(b); }
  });
}
function go(id){ location.href='/course.html?course='+id; }
var savedProgress=null;
Auth.guard().then(function(u){
  if((u.credits||0) < 0.25){ location.href='/pricing.html'; return; }
  nativeLang=localStorage.getItem('nativeLang')||u.nativeLang||'en';
  if(nativeLang) setUiLang(nativeLang,false);
  applyI18n();
  renderUnits();
  Auth.get('/api/progress').then(function(d){ savedProgress=(d&&d.progress)||{}; paintProgress(savedProgress); }).catch(function(){});
  ensureListRT().then(function(){
    renderUnits();
    if(savedProgress) paintProgress(savedProgress);
    if(window.FX) setTimeout(function(){FX.playEntrance();},40);
  });
}).catch(function(){});
</script>
</body>
</html>
